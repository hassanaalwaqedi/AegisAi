name: aegis-rtsp-demo

x-simulator: &simulator
  image: jrottenberg/ffmpeg:7.1-alpine
  depends_on:
    mediamtx:
      condition: service_started
  restart: unless-stopped
  volumes:
    - ../../data/uploads:/media:ro

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: aegis-rtsp-demo-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8554:8554"

  camera-01:
    <<: *simulator
    command: ["-stream_loop", "-1", "-re", "-i", "/media/df67a73dd50c450395a4fb97c6a40adb.mp4", "-an", "-vf", "fps=5,scale=640:360", "-c:v", "libx264", "-preset", "ultrafast", "-tune", "zerolatency", "-g", "5", "-keyint_min", "5", "-f", "rtsp", "-rtsp_transport", "tcp", "rtsp://mediamtx:8554/aegis-cam-01"]
  camera-02:
    <<: *simulator
    command: ["-stream_loop", "-1", "-re", "-i", "/media/d27264e2d3814386a6a575ca831fc666.mp4", "-an", "-vf", "fps=5,scale=640:360", "-c:v", "libx264", "-preset", "ultrafast", "-tune", "zerolatency", "-g", "5", "-keyint_min", "5", "-f", "rtsp", "-rtsp_transport", "tcp", "rtsp://mediamtx:8554/aegis-cam-02"]
