# AegisAI Production Deployment
# Docker Compose with nginx HTTPS termination

version: "3.8"

services:
  # ===========================================
  # nginx Reverse Proxy (HTTPS termination)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: aegis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - aegisai
      - frontend
    restart: unless-stopped
    networks:
      - aegis-network
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # AegisAI Backend (API + Processing)
  # ===========================================
  aegisai:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aegis-backend
    environment:
      - AEGIS_API_HOST=0.0.0.0
      - AEGIS_API_PORT=8080
      - AEGIS_API_KEY=${AEGIS_API_KEY:?AEGIS_API_KEY must be set}
      - AEGIS_DEBUG=false
      - DATABASE_URL=sqlite:////app/data/aegis.db
    volumes:
      - aegis-data:/app/data
      - aegis-models:/app/models
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - aegis-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    environment:
      - NODE_ENV=production
      - AEGIS_API_URL=http://aegisai:8080
      - AEGIS_API_KEY=${AEGIS_API_KEY:?AEGIS_API_KEY must be set}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - aegis-network
    depends_on:
      - aegisai
  # ===========================================
  # PostgreSQL (optional - for production scale)
  # ===========================================
