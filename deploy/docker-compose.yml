  #   expose:
  #     - "5432"
  #   restart: unless-stopped
  #   networks:
  #     - aegis-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U aegis"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ===========================================
  # Redis (optional - for caching)
