version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aegis_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aegisai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aegis -d aegisai" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # AegisAI Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AEGIS_DETECTION_MODEL_PATH: ${AEGIS_DETECTION_MODEL_PATH:-/app/models/yolo11n.pt}
        AEGIS_THREAT_MODEL_PATH: ${AEGIS_THREAT_MODEL_PATH:-/app/models/yoloe-26n-seg.pt}
        AEGIS_THREAT_PROMPT_EMBEDDINGS_PATH: ${AEGIS_THREAT_PROMPT_EMBEDDINGS_PATH:-/app/models/yoloe-26n-seg.threat-prompts.npz}
    container_name: aegis_api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_secret}@postgres:5432/${POSTGRES_DB:-aegisai}
      - REDIS_URL=redis://redis:6379/0
      - AEGIS_API_KEY=${AEGIS_API_KEY:?AEGIS_API_KEY must be set}
      - AEGIS_DEBUG=${AEGIS_DEBUG:-false}
      - AEGIS_DEVICE=${AEGIS_DEVICE:-auto}
      - AEGIS_DETECTION_MODEL_PATH=${AEGIS_DETECTION_MODEL_PATH:-/app/models/yolo11n.pt}
      - AEGIS_DETECTION_HALF_PRECISION=${AEGIS_DETECTION_HALF_PRECISION:-false}
      - AEGIS_WEAPON_MODEL_PATH=${AEGIS_WEAPON_MODEL_PATH:-/app/models/weapon_detector.pt}
      - AEGIS_WEAPON_DETECTOR_ENABLED=${AEGIS_WEAPON_DETECTOR_ENABLED:-false}
      - AEGIS_THREAT_DETECTOR_ENABLED=${AEGIS_THREAT_DETECTOR_ENABLED:-true}
      - AEGIS_THREAT_DETECTOR_BACKEND=${AEGIS_THREAT_DETECTOR_BACKEND:-yoloe}
      - AEGIS_THREAT_MODEL_PATH=${AEGIS_THREAT_MODEL_PATH:-/app/models/yoloe-26n-seg.pt}
      - AEGIS_THREAT_PROMPT_EMBEDDINGS_PATH=${AEGIS_THREAT_PROMPT_EMBEDDINGS_PATH:-/app/models/yoloe-26n-seg.threat-prompts.npz}
      - AEGIS_THREAT_CLASSES_JSON=${AEGIS_THREAT_CLASSES_JSON:-["handgun","pistol","revolver","rifle","shotgun","knife","machete","baseball bat","crowbar"]}
      - AEGIS_THREAT_CONFIDENCE_THRESHOLD=${AEGIS_THREAT_CONFIDENCE_THRESHOLD:-0.35}
      - AEGIS_THREAT_FRAME_SKIP=${AEGIS_THREAT_FRAME_SKIP:-3}
      - AEGIS_THREAT_FUSION_ENABLED=${AEGIS_THREAT_FUSION_ENABLED:-true}
      - AEGIS_THREAT_DEDUP_IOU_THRESHOLD=${AEGIS_THREAT_DEDUP_IOU_THRESHOLD:-0.55}
      - AEGIS_THREAT_PERSON_EXPANSION_RATIO=${AEGIS_THREAT_PERSON_EXPANSION_RATIO:-0.25}
      - AEGIS_THREAT_ASSOCIATION_MIN_SCORE=${AEGIS_THREAT_ASSOCIATION_MIN_SCORE:-0.45}
      - AEGIS_THREAT_ASSOCIATION_WINNER_MARGIN=${AEGIS_THREAT_ASSOCIATION_WINNER_MARGIN:-0.08}
      - AEGIS_THREAT_EVIDENCE_TTL_FRAMES=${AEGIS_THREAT_EVIDENCE_TTL_FRAMES:-9}
      - AEGIS_THREAT_CONTINUITY_BONUS=${AEGIS_THREAT_CONTINUITY_BONUS:-0.08}
      - AEGIS_ALLOWED_ORIGINS=${AEGIS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      - AEGIS_PIPELINE_AUTOSTART=${AEGIS_PIPELINE_AUTOSTART:-false}
      - AEGIS_PIPELINE_WARM_MODEL=${AEGIS_PIPELINE_WARM_MODEL:-true}
      - AEGIS_CAMERA_STREAM_FPS=${AEGIS_CAMERA_STREAM_FPS:-15}
      - AEGIS_CAMERA_INFERENCE_FPS=${AEGIS_CAMERA_INFERENCE_FPS:-5}
      - AEGIS_CAMERA_PREVIEW_MAX_WIDTH=${AEGIS_CAMERA_PREVIEW_MAX_WIDTH:-960}
      - AEGIS_CAMERA_PREVIEW_JPEG_QUALITY=${AEGIS_CAMERA_PREVIEW_JPEG_QUALITY:-75}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - VLM_ENABLED=${VLM_ENABLED:-false}
      - VLM_VERIFY_INCIDENTS=${VLM_VERIFY_INCIDENTS:-true}
      - VLM_VERIFY_CANDIDATES=${VLM_VERIFY_CANDIDATES:-true}
      - VLM_ALLOWED_CAMERA_IDS=${VLM_ALLOWED_CAMERA_IDS:-${VLM_CAMERA_ALLOWLIST:-[]}}
      - VLM_CAMERA_ALLOWLIST=${VLM_CAMERA_ALLOWLIST:-}
      - VLM_MIN_RISK_SCORE=${VLM_MIN_RISK_SCORE:-0.70}
      - VLM_MIN_SEVERITY=${VLM_MIN_SEVERITY:-MEDIUM}
      - VLM_CANDIDATE_MIN_RISK_SCORE=${VLM_CANDIDATE_MIN_RISK_SCORE:-0.35}
      - VLM_CANDIDATE_MIN_SEVERITY=${VLM_CANDIDATE_MIN_SEVERITY:-MEDIUM}
      - VLM_MAX_CONCURRENT_REQUESTS=${VLM_MAX_CONCURRENT_REQUESTS:-2}
      - VLM_TIMEOUT_SECONDS=${VLM_TIMEOUT_SECONDS:-30}
      - VLM_PRE_EVENT_SECONDS=${VLM_PRE_EVENT_SECONDS:-5}
      - VLM_POST_EVENT_SECONDS=${VLM_POST_EVENT_SECONDS:-5}
      - VLM_BUFFER_FRAMES=${VLM_BUFFER_FRAMES:-50}
      - VLM_MAX_KEYFRAMES=${VLM_MAX_KEYFRAMES:-6}
      - VLM_JPEG_QUALITY=${VLM_JPEG_QUALITY:-80}
      - VLM_MODEL=${VLM_MODEL:-}
      - GEMINI_LIVE_ENABLED=${GEMINI_LIVE_ENABLED:-false}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      - GEMINI_LIVE_VOICE=${GEMINI_LIVE_VOICE:-Kore}
      - GEMINI_LIVE_INPUT_SAMPLE_RATE=${GEMINI_LIVE_INPUT_SAMPLE_RATE:-16000}
      - GEMINI_LIVE_OUTPUT_SAMPLE_RATE=${GEMINI_LIVE_OUTPUT_SAMPLE_RATE:-24000}
      - GEMINI_LIVE_CONNECT_TIMEOUT_SECONDS=${GEMINI_LIVE_CONNECT_TIMEOUT_SECONDS:-12}
      - GEMINI_LIVE_SESSION_TTL_SECONDS=${GEMINI_LIVE_SESSION_TTL_SECONDS:-120}
      - GEMINI_LIVE_MAX_SESSION_SECONDS=${GEMINI_LIVE_MAX_SESSION_SECONDS:-900}
      - GEMINI_LIVE_TRANSCRIPT_RETENTION_SECONDS=${GEMINI_LIVE_TRANSCRIPT_RETENTION_SECONDS:-0}
      - GEMINI_LIVE_TOOL_AUDIT_RETENTION_SECONDS=${GEMINI_LIVE_TOOL_AUDIT_RETENTION_SECONDS:-3600}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Next.js dashboard. It owns the authenticated /api/backend proxy, so the
  # browser never receives AEGIS_API_KEY.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis_frontend
    environment:
      - NODE_ENV=production
      - AEGIS_API_URL=http://api:8080
      - AEGIS_API_KEY=${AEGIS_API_KEY:?AEGIS_API_KEY must be set}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

